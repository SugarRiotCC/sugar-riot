<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to the Chaos !</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- CRUMB BURST -->
<div id="crumb-burst"></div>

<!-- HERO -->
<div id="hero-logo" class="reveal">

    <img src="Logo.png" alt="Sugar Riot Logo" class="logo"/>

    <h2 class="tagline">Crumbs and Chaos</h2>

    <svg class="scribble" viewBox="0 0 300 30">
        <path d="M5 20 Q 50 5, 100 20 T 200 15 T 295 20" />
        <path d="M5 22 Q 60 10, 120 22 T 220 18 T 295 22" class="alt-line"/>
    </svg>
</br>
    <a href="#shop" class="btn">SHOP THE CHAOS</a>

</div>

<!-- ABOUT -->
<div class="section about reveal">
    <div class="content">
        <img src="profile.png" alt="Creator of Sugar Riot" class="profile" />
        <div class="text">
            <p>I don’t do perfect.</p>
            <p>I do yarn tangles, flour explosions, and sawdust therapy.</p>
            <p><strong>Welcome to the chaos.</strong></p>
        </div>
    </div>
</div>

<!-- SERVICES -->
<div class="section services reveal">
    <h2>THE CHAOS</h2>
    <div class="grid">
        <div class="card">🧶 Crochet</div>
        <div class="card">🧵 Sewing</div>
        <div class="card">🧁 Baking</div>
        <div class="card">🪵 Woodcraft</div>
    </div>
</div>

<!-- SHOP -->
<div class="section shop reveal" id="shop">
    <h2>SHOP</h2>
    <div class="grid">

        <div class="product">
            <h3>Chaos Beanie</h3>
            <p>$15</p>
            <button onclick="addToCart('Chaos Beanie',15)">Add</button>
        </div>

        <div class="product">
            <h3>Rebel Apron</h3>
            <p>$20</p>
            <button onclick="addToCart('Rebel Apron',20)">Add</button>
        </div>

        <div class="product">
            <h3>Sawdust Art</h3>
            <p>$25</p>
            <button onclick="addToCart('Sawdust Art',25)">Add</button>
        </div>

    </div>
</div>

<!-- CART -->
<div class="section cart reveal">
    <h2>Your Chaos Cart</h2>
    <ul id="cart-list"></ul>
    <p id="total"></p>
    <button class="btn pink">Checkout (Connect PayPal Later)</button>
</div>

<!-- FOOTER -->
<div id="footer">
    <p>Sugar Riot © 2026</p>
</div>

<!-- JS -->
<script>

/* SCROLL REVEAL */
window.dispatchEvent(new Event("scroll"));
window.addEventListener("scroll", () => {
    document.querySelectorAll(".reveal").forEach(el => {
        let top = el.getBoundingClientRect().top;
        if (top < window.innerHeight - 100) {
            el.classList.add("active");
        }
    });
});

/* CART */
let cart = [];
function addToCart(name, price){
    cart.push({name, price});
    renderCart();
}

function renderCart(){
    let list = document.getElementById("cart-list");
    let total = 0;
    list.innerHTML = "";

    cart.forEach(item=>{
        total += item.price;
        let li = document.createElement("li");
        li.textContent = item.name + " - $" + item.price;
        list.appendChild(li);
    });

    document.getElementById("total").textContent = "Total: $" + total;
}

/* CRUMB BURST */
document.addEventListener("click", e => {
    for(let i=0;i<8;i++){
        let crumb = document.createElement("div");
        crumb.className="crumb";
        crumb.style.left=e.clientX+"px";
        crumb.style.top=e.clientY+"px";
        crumb.style.setProperty("--x",(Math.random()*100-50)+"px");
        crumb.style.setProperty("--y",(Math.random()*100-50)+"px");
        document.getElementById("crumb-burst").appendChild(crumb);
        setTimeout(()=>crumb.remove(),800);
    }
});
document.querySelectorAll(".reveal").forEach(el => {
    let path = el.querySelector("path");
    if (path) {
        path.style.animation = "draw 1.8s ease forwards";
    }
});
</script>

</body>
</html>
